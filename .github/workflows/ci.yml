name: QRNG-DQI-Optimizer Multi-Condition Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # GitHub 웹 화면에서 버튼을 눌러 수동 실행 가능

jobs:
  matrix-testing:
    name: Test (Py ${{ matrix.python-version }} | Qubits ${{ matrix.num-qubits }} | Sample ${{ matrix.sample-size }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false # 특정 조합이 실패해도 나머지 테스트 조합을 끝까지 진행
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        num-qubits: [16, 32, 64] # 큐비트 규모별 테스트 조건
        sample-size: [1024, 4096, 16384] # 엔트로피 샘플 크기별 테스트 조건

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run Multi-Condition Pytest Suite
        env:
          TEST_NUM_QUBITS: ${{ matrix.num-qubits }}
          TEST_SAMPLE_SIZE: ${{ matrix.sample-size }}
        run: |
          python -m pytest tests/ -v --cov=src/qrng_dqi_optimizer

      - name: Run Benchmark Evaluator
        run: |
          python -m benchmarks.metrics_evaluator || true

      - name: Upload Test Artifacts & Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-py${{ matrix.python-version }}-q${{ matrix.num-qubits }}-s${{ matrix.sample-size }}
          path: |
            *.json
            *.log
